<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>수업 만족도 설문 · 헬로미추</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{
  --pink:#F4B8C8; --pink-soft:#FCE9EE; --pink-deep:#E8859F;
  --ink:#141414; --ink-2:#555; --line:#E7E2E3; --bg:#FFFBFC; --white:#fff;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink);font-family:Pretendard,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;padding:0 16px 80px}
.wrap{max-width:640px;margin:0 auto}
header.top{display:flex;align-items:center;justify-content:space-between;padding:18px 0 10px}
.logo{font-weight:800;letter-spacing:-.02em;font-size:15px}
.logo img{height:26px;display:block}
.logo span{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--pink);margin-right:6px;vertical-align:1px}
.progress{height:4px;background:var(--pink-soft);border-radius:4px;overflow:hidden;margin-bottom:22px}
.progress i{display:block;height:100%;width:0;background:var(--ink);transition:width .35s}
.hero{background:var(--ink);color:#fff;border-radius:22px;padding:28px 24px;margin-bottom:18px;position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;right:-40px;top:-40px;width:150px;height:150px;border-radius:50%;background:var(--pink);opacity:.9}
.hero small{display:block;color:var(--pink);font-weight:700;font-size:13px;margin-bottom:10px;position:relative;z-index:1}
.hero h1{font-size:24px;line-height:1.35;letter-spacing:-.03em;position:relative;z-index:1;max-width:85%}
.hero p{margin-top:12px;color:#ddd;font-size:14px;position:relative;z-index:1}
.card{background:var(--white);border:1px solid var(--line);border-radius:18px;padding:22px 20px;margin-bottom:14px}
.card h2{font-size:18px;letter-spacing:-.02em;margin-bottom:6px}
.muted{color:var(--ink-2);font-size:14px;line-height:1.6}
label.f{display:block;font-size:13px;font-weight:700;margin:14px 0 6px}
input[type=text],input[type=date],textarea{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:13px 14px;font:inherit;font-size:16px;background:#fff;color:var(--ink)}
input:focus,textarea:focus{outline:none;border-color:var(--ink)}
textarea{min-height:92px;resize:vertical;line-height:1.55}
.types{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.type{border:1.5px solid var(--line);background:#fff;border-radius:16px;padding:18px 14px;text-align:left;font:inherit;cursor:pointer;transition:.15s}
.type b{display:block;font-size:16px;margin-bottom:4px}
.type span{font-size:12.5px;color:var(--ink-2)}
.type:hover{border-color:var(--pink-deep)}
.type.on{border-color:var(--ink);background:var(--pink-soft);box-shadow:inset 0 0 0 1px var(--ink)}
.q{padding:20px 0;border-top:1px solid var(--line)}
.q:first-of-type{border-top:0;padding-top:4px}
.q .t{font-weight:700;font-size:16px;line-height:1.45;margin-bottom:12px}
.q .t em{font-style:normal;color:var(--pink-deep);margin-right:6px}
.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.scale button{border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:10px 2px 8px;font:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;min-height:64px;transition:.12s}
.scale button .n{font-size:17px;font-weight:800}
.scale button .face{font-size:26px;line-height:1}
.scale button .l{font-size:10.5px;color:var(--ink-2);line-height:1.25;text-align:center;word-break:keep-all}
.scale button.on{background:var(--ink);border-color:var(--ink);color:#fff}
.scale button.on .l{color:var(--pink)}
.q.miss .t{color:#C0392B}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:17px;font:inherit;font-size:16px;font-weight:800;cursor:pointer;background:var(--ink);color:#fff;margin-top:8px}
.btn:disabled{opacity:.35;cursor:default}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line);font-weight:700}
.row{display:flex;gap:8px}
.row .btn{flex:1}
.step{display:none}
.step.on{display:block;animation:up .3s ease}
@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.notice{background:#FFF4D6;border:1px solid #F1D98A;color:#6B5310;border-radius:12px;padding:10px 14px;font-size:13px;margin-bottom:14px;display:none}
.done{text-align:center;padding:40px 20px}
.done .dot{width:72px;height:72px;border-radius:50%;background:var(--pink);margin:0 auto 18px;display:flex;align-items:center;justify-content:center;font-size:34px;font-weight:900}
.err{color:#C0392B;font-size:13px;margin-top:10px;min-height:18px}
.classLine{display:none;font-size:13px;color:var(--ink-2);margin:0 4px 10px}
.classLine b{color:var(--ink);font-size:16px;display:block;margin-top:2px;letter-spacing:-.02em}
footer{text-align:center;color:#999;font-size:12px;margin-top:30px}
@media (min-width:600px){ .types{grid-template-columns:1fr 1fr} .hero h1{font-size:28px} }
</style>
</head>
<body>
<div class="wrap">
  <header class="top"><div class="logo" id="logo"><span></span>Artable</div><div class="muted" id="stepLabel" style="font-size:12px"></div></header>
  <div class="progress"><i id="bar"></i></div>
  <div class="notice" id="demoNotice">미리보기 모드예요. config.js에 Apps Script 주소를 넣기 전에는 응답이 저장되지 않아요.</div>

  <!-- STEP 0 : 인트로 -->
  <section class="step on" id="s0">
    <div class="hero">
      <small id="heroOrg">수업 만족도 설문</small>
      <h1 id="heroTitle">오늘 수업은 어떠셨나요?</h1>
      <p id="heroDate">1분이면 끝나요. 솔직한 이야기가 다음 수업을 더 좋게 만들어요.</p>
    </div>
    <div class="card" id="manualClass" style="display:none">
      <h2>수업 정보</h2>
      <p class="muted">참여하신 수업 이름을 적어 주세요.</p>
      <label class="f" for="inClassName">수업명</label>
      <input type="text" id="inClassName" placeholder="예: 수채화 원데이 클래스">
      <label class="f" for="inClassDate">수업일</label>
      <input type="date" id="inClassDate">
    </div>
    <div class="card" id="typeCard">
      <h2>누가 응답하나요?</h2>
      <p class="muted">해당하는 것을 하나 골라 주세요.</p>
      <div class="types" id="typeBox"></div>
    </div>
    <button class="btn" id="startBtn" disabled>시작하기</button>
    <div class="err" id="err0"></div>
  </section>

  <!-- STEP 1 : 점수 문항 -->
  <section class="step" id="sLoad"><div class="card" style="text-align:center;padding:60px 20px"><p class="muted">수업 정보를 불러오는 중…</p></div></section>

  <section class="step" id="s1">
    <div class="classLine" id="classLine"></div>
    <div class="card" id="qBox"></div>
    <div class="row"><button class="btn ghost" data-go="0" id="back1">이전</button><button class="btn" id="next1">다음</button></div>
    <div class="err" id="err1"></div>
  </section>

  <!-- STEP 2 : 서술 문항 -->
  <section class="step" id="s2">
    <div class="card" id="oBox"></div>
    <div class="row"><button class="btn ghost" data-go="1">이전</button><button class="btn" id="submitBtn">제출하기</button></div>
    <div class="err" id="err2"></div>
  </section>

  <!-- STEP 3 : 완료 -->
  <section class="step" id="s3">
    <div class="card done">
      <div class="dot">✓</div>
      <h2 id="doneTitle">소중한 의견 고마워요!</h2>
      <p class="muted" style="margin-top:8px" id="doneMsg">남겨주신 이야기는 다음 수업 준비에 꼭 반영할게요.</p>
      <button class="btn ghost" style="margin-top:24px" id="againBtn">다른 사람도 응답하기</button>
    </div>
  </section>

  <footer id="foot">주식회사 헬로미추 · Hello Michu</footer>
</div>

<script src="config.js"></script>
<script>
(function(){
  var P = new URLSearchParams(location.search);
  var S = { cls: (P.get('cls')||'').trim(), className:'', classDate:'', type:'', ans:{} };
  var $ = function(id){ return document.getElementById(id); };
  var FACES = ['😣','🙁','😐','🙂','😍'];

  if (!apiReady()) $('demoNotice').style.display = 'block';
  /* 브랜드 */
  document.title = '수업 만족도 설문 · ' + BRAND.name;
  if (BRAND.logoImg) { $('logo').innerHTML = '<img alt="">'; $('logo').firstChild.src = BRAND.logoImg; $('logo').firstChild.alt = BRAND.name; }
  else $('logo').lastChild.textContent = BRAND.logoText || BRAND.name;
  $('foot').textContent = BRAND.footer || BRAND.name;

  /* 응답자 유형 카드 */
  TYPES.forEach(function(t){
    var b = document.createElement('button');
    b.className = 'type'; b.type = 'button'; b.dataset.id = t.id;
    b.innerHTML = '<b>'+t.label+'</b><span>'+t.sub+'</span>';
    b.onclick = function(){
      S.type = t.id;
      [].forEach.call(document.querySelectorAll('.type'), function(x){ x.classList.toggle('on', x===b); });
      checkStart();
    };
    $('typeBox').appendChild(b);
  });
  $('inClassDate').value = new Date(Date.now()+9*3600e3).toISOString().slice(0,10);
  $('inClassName').oninput = checkStart;

  function checkStart(){
    var nameOk = $('manualClass').style.display === 'none' || $('inClassName').value.trim();
    $('startBtn').disabled = !(S.type && nameOk);
  }

  /* 수업 정보 불러오기 */
  function manual(){ $('manualClass').style.display = 'block'; showTypes(); checkStart(); }
  function showTypes(){ $('typeCard').style.display = 'block'; }
  if (S.cls && apiReady()) {
    $('typeCard').style.display = 'none';
    $('heroDate').textContent = '수업 정보를 불러오는 중…';
    jsonp({action:'class', cls:S.cls}).then(function(r){
      if (r && r.ok) {
        S.className = r.cls.name; S.classDate = r.cls.date;
        $('heroOrg').textContent = [r.cls.org, '수업 만족도 설문'].filter(Boolean).join(' · ');
        $('heroTitle').textContent = r.cls.name;
        $('heroDate').textContent = (r.cls.date ? r.cls.date + ' · ' : '') + '1분이면 끝나요.';
        if (r.cls.type && WORDING[r.cls.type]) {   // 강사가 시트에서 미리 지정한 응답자 유형 → 바로 문항부터
          S.type = r.cls.type; SKIP = true;
          $('classLine').innerHTML = (r.cls.org ? r.cls.org + ' · 수업 만족도 설문' : '수업 만족도 설문') + '<b></b>';
          $('classLine').querySelector('b').textContent = r.cls.name;
          $('classLine').style.display = 'block';
          $('back1').style.display = 'none';
          buildQuestions(); go(1); return;
        }
        showTypes(); go(0);
        checkStart();
      } else { $('heroDate').textContent = '등록되지 않은 수업코드예요. 수업명을 직접 적어 주세요.'; manual(); go(0); }
    }).catch(function(){ $('heroDate').textContent = '1분이면 끝나요.'; manual(); go(0); });
  } else if (!S.cls) { manual(); }

  /* 단계 이동 */
  var SKIP = false; // 응답자 유형이 미리 지정되면 첫 화면 생략
  function go(n){
    $('sLoad').classList.remove('on');
    [0,1,2,3].forEach(function(i){ $('s'+i).classList.toggle('on', i===n); });
    $('bar').style.width = (SKIP ? [0,45,80,100] : [8,40,75,100])[n] + '%';
    $('stepLabel').textContent = n<3 ? (SKIP ? n+' / 2' : (n+1)+' / 3') : '';
    window.scrollTo({top:0, behavior:'smooth'});
  }
  [].forEach.call(document.querySelectorAll('[data-go]'), function(b){ b.onclick = function(){ go(+b.dataset.go); }; });
  if (S.cls && apiReady()) { [0,1,2,3].forEach(function(i){ $('s'+i).classList.remove('on'); }); $('sLoad').classList.add('on'); }
  else go(0);

  $('startBtn').onclick = function(){
    if ($('manualClass').style.display !== 'none') {
      S.className = $('inClassName').value.trim(); S.classDate = $('inClassDate').value;
    }
    buildQuestions(); go(1);
  };

  function buildQuestions(){
    var W = WORDING[S.type];
    var h = '';
    ITEMS.forEach(function(it, i){
      h += '<div class="q" id="wrap_'+it.key+'"><div class="t"><em>'+(i+1)+'</em>'+W[it.key]+'</div><div class="scale" data-k="'+it.key+'">';
      for (var v=1; v<=5; v++) {
        var on = S.ans[it.key]===v ? ' on' : '';
        h += '<button type="button" class="'+on.trim()+'" data-v="'+v+'" aria-label="'+W.scale[v-1]+'">' +
             (W.faces ? '<span class="face">'+FACES[v-1]+'</span>' : '<span class="n">'+v+'</span>') +
             '<span class="l">'+W.scale[v-1]+'</span></button>';
      }
      h += '</div></div>';
    });
    $('qBox').innerHTML = h;
    [].forEach.call($('qBox').querySelectorAll('.scale'), function(sc){
      sc.addEventListener('click', function(e){
        var b = e.target.closest('button'); if(!b) return;
        S.ans[sc.dataset.k] = +b.dataset.v;
        [].forEach.call(sc.children, function(x){ x.classList.toggle('on', x===b); });
        $('wrap_'+sc.dataset.k).classList.remove('miss');
        if (!document.querySelector('.q.miss')) $('err1').textContent = '';
      });
    });
    var o = '';
    OPENS.forEach(function(it){
      o += '<label class="f" for="in_'+it.key+'">'+W[it.key]+'</label><textarea id="in_'+it.key+'" maxlength="1500"></textarea>';
    });
    o += '<label class="f" for="in_name">'+W.name+'</label><input type="text" id="in_name" maxlength="50">';
    $('oBox').innerHTML = '<h2>'+(S.type==='kid'?'하고 싶은 이야기':'자유롭게 들려주세요')+'</h2><p class="muted">'+(S.type==='kid'?'쓰고 싶은 것만 써도 괜찮아요.':'모든 항목은 선택이에요.')+'</p>' + o;
  }

  $('next1').onclick = function(){
    var miss = ITEMS.filter(function(it){ return !S.ans[it.key]; });
    [].forEach.call(document.querySelectorAll('.q'), function(q){ q.classList.remove('miss'); });
    if (miss.length) {
      miss.forEach(function(it){ $('wrap_'+it.key).classList.add('miss'); });
      $('err1').textContent = '빠진 문항이 '+miss.length+'개 있어요.';
      $('wrap_'+miss[0].key).scrollIntoView({behavior:'smooth', block:'center'});
      return;
    }
    $('err1').textContent = ''; go(2);
  };

  var sending = false;
  $('submitBtn').onclick = function(){
    if (sending) return; sending = true;
    var btn = this; btn.disabled = true; btn.textContent = '보내는 중…';
    var payload = { cls:S.cls, className:S.className, classDate:S.classDate, type:S.type, name:$('in_name').value.trim() };
    ITEMS.forEach(function(it){ payload[it.key] = S.ans[it.key]; });
    OPENS.forEach(function(it){ payload[it.key] = $('in_'+it.key).value.trim(); });

    var p = apiReady() ? postData(payload) : new Promise(function(r){ setTimeout(r, 600); });
    p.then(function(){
      if (S.type==='kid') { $('doneTitle').textContent = '고마워요!'; $('doneMsg').textContent = '오늘 멋진 작품 만들어 줘서 고마워요. 또 만나요!'; }
      go(3);
    }).catch(function(){
      $('err2').textContent = '전송에 실패했어요. 인터넷 연결을 확인하고 다시 눌러 주세요.';
      btn.disabled = false; btn.textContent = '제출하기'; sending = false;
    });
  };

  $('againBtn').onclick = function(){ location.reload(); };
})();
</script>
</body>
</html>
