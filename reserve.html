<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>헬로미추 체험 예약</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- 폰트는 렌더링을 막지 않게 나중에 적용한다. 부스 네트워크가 느려도
     시스템 폰트로 화면이 먼저 뜬다. -->
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@700;800&family=Noto+Sans+KR:wght@400;500;700&display=swap"
      onload="this.onload=null;this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@700;800&family=Noto+Sans+KR:wght@400;500;700&display=swap"></noscript>
<style>
  *,*::before,*::after{ box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  :root{
    --ink:#14100b; --soft:#5f5346; --faint:#8b7f70;
    --paper:#f6f2ea; --surface:#fff; --sunk:#efe9de;
    --teal:#14796a; --teal-bg:#e4f0ec; --amber:#b8620f; --red:#b23838; --rule:#ddd4c6;
  }
  body{
    background:var(--paper); color:var(--ink);
    font-family:'Noto Sans KR',-apple-system,BlinkMacSystemFont,sans-serif;
    font-size:15px; line-height:1.7; padding:0 0 10rem; max-width:560px; margin:0 auto;
    -webkit-text-size-adjust:100%;
  }
  header{ padding:1.4rem .95rem .8rem; }
  h1{ font-family:'Nanum Myeongjo',serif; font-size:1.5rem; font-weight:800; line-height:1.35; }
  header .when{ font-size:.82rem; color:var(--soft); margin-top:.35rem; }
  .pane{ padding:0 .95rem; }
  h2{ font-size:.72rem; font-weight:700; letter-spacing:.1em; color:var(--soft); margin:1.4rem 0 .5rem; }
  h2:first-child{ margin-top:.4rem; }

  .card{ background:var(--surface); border:1px solid var(--rule); border-radius:12px; padding:.95rem 1rem; }

  /* 프로그램 */
  .progs{ display:grid; grid-template-columns:1fr 1fr; gap:.55rem; }
  .prog{
    border:2px solid var(--rule); background:var(--surface); border-radius:11px;
    padding:.85rem .7rem; text-align:left; font-family:inherit; cursor:pointer; color:var(--ink); min-height:78px;
  }
  .prog .n{ font-size:.98rem; font-weight:700; }
  .prog .m{ font-size:.72rem; color:var(--soft); margin-top:.2rem; line-height:1.5; }
  .prog.on{ border-color:var(--teal); background:var(--teal-bg); }
  .prog.on .n{ color:var(--teal); }

  /* 시간 */
  .times{ display:grid; grid-template-columns:repeat(auto-fit,minmax(96px,1fr)); gap:.5rem; }
  .time{
    border:2px solid var(--rule); background:var(--surface); border-radius:10px; padding:.6rem .3rem;
    font-family:inherit; cursor:pointer; color:var(--ink); min-height:62px;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:.15rem;
  }
  .time .t{ font-size:1rem; font-weight:700; font-variant-numeric:tabular-nums; }
  .time .r{ font-size:.68rem; color:var(--soft); }
  .time.on{ border-color:var(--teal); background:var(--teal); }
  .time.on .t,.time.on .r{ color:#fff; }
  .time.low .r{ color:var(--amber); font-weight:700; }
  .time:disabled{ opacity:.4; cursor:not-allowed; background:var(--sunk); }
  .time:disabled .r{ color:var(--red); }

  /* 도안 */
  .designs{ display:flex; flex-direction:column; gap:.45rem; }
  .design{
    display:flex; align-items:center; gap:.6rem; border:1.5px solid var(--rule); background:var(--paper);
    border-radius:10px; padding:.6rem .75rem; font-family:inherit; cursor:pointer; color:var(--ink); text-align:left; min-height:52px;
  }
  .design .n{ flex:1; font-size:.87rem; font-weight:500; }
  .design .r{ font-size:.7rem; color:var(--soft); }
  .design.on{ border-color:var(--amber); background:#fdf4e9; }
  .design.on .n{ font-weight:700; color:var(--amber); }
  .design:disabled{ opacity:.4; }

  label.f{ display:block; font-size:.8rem; font-weight:700; margin-bottom:.3rem; }
  label.f .req{ color:var(--red); margin-left:.15rem; }
  input[type=text],input[type=tel]{
    width:100%; font-family:inherit; font-size:.95rem; color:var(--ink); background:var(--paper);
    border:1.5px solid var(--rule); border-radius:9px; padding:.7rem .8rem; min-height:52px;
  }
  input:focus{ outline:2px solid var(--teal); outline-offset:1px; border-color:var(--teal); }
  .field{ margin-bottom:.8rem; }
  .field:last-child{ margin-bottom:0; }
  .hint{ font-size:.72rem; color:var(--faint); margin-top:.3rem; line-height:1.6; }

  /* ── 개인정보 수집·이용 고지 — 신청이 곧 동의다 ── */
  .pv .lead{ font-size:.8rem; line-height:1.7; margin-bottom:.6rem; }
  .pv .lead b{ color:var(--teal); font-weight:700; }
  .pv table{ width:100%; border-collapse:collapse; font-size:.73rem; line-height:1.55; }
  .pv th,.pv td{ border:1px solid var(--rule); padding:.4rem .45rem; text-align:left; vertical-align:top; }
  .pv th{ background:#f2ece2; font-weight:700; color:var(--soft); white-space:nowrap; }
  .pv details{ margin-top:.6rem; }
  .pv summary{ font-size:.75rem; font-weight:700; color:var(--teal); cursor:pointer; padding:.35rem 0; list-style:none; }
  .pv summary::-webkit-details-marker{ display:none; }
  .pv summary::before{ content:'▸ '; }
  .pv details[open] summary::before{ content:'▾ '; }
  .pv .full{ font-size:.72rem; color:var(--soft); line-height:1.75; padding-top:.3rem; }
  .pv .full p{ margin-bottom:.5rem; }
  .pv .full b{ color:var(--ink); }
  .bar .consent{ font-size:.71rem; color:var(--faint); text-align:center; line-height:1.5; margin-bottom:.4rem; }
  .bar .consent b{ color:var(--soft); font-weight:700; }

  .bar{
    position:fixed; left:0; right:0; bottom:0; z-index:30; max-width:560px; margin:0 auto;
    padding:.7rem .95rem calc(.7rem + env(safe-area-inset-bottom));
    background:rgba(246,242,234,.97); border-top:1px solid var(--rule);
  }
  .bar .sum{ font-size:.75rem; color:var(--soft); margin-bottom:.45rem; text-align:center; }
  .bar .sum b{ color:var(--teal); }
  .bar button{
    width:100%; min-height:56px; border:2px solid var(--teal); background:var(--teal); color:#fff;
    border-radius:11px; font-family:inherit; font-size:1.02rem; font-weight:700; cursor:pointer;
  }
  .bar button:disabled{ opacity:.4; }

  .notice{ background:#fdf3e6; border:1px solid var(--amber); color:var(--soft); border-radius:9px;
           padding:.7rem .85rem; margin:0 .95rem .6rem; font-size:.76rem; line-height:1.6; }
  .notice b{ color:var(--amber); }
  .err{ background:#fdecea; border:1px solid var(--red); color:var(--red); border-radius:9px;
        padding:.7rem .85rem; font-size:.82rem; margin:0 .95rem .8rem; line-height:1.6; display:none; }
  .err.on{ display:block; }

  .done{ padding:2.4rem 1.2rem; text-align:center; }
  .done .mark{ width:76px; height:76px; margin:0 auto .9rem; border-radius:50%; background:var(--teal);
               position:relative; box-shadow:0 6px 18px rgba(20,121,106,.28); }
  .done .mark::after{ content:''; position:absolute; left:27px; top:16px; width:16px; height:34px;
                      border:solid #fff; border-width:0 5px 5px 0; transform:rotate(45deg); border-radius:2px; }
  .done h1{ margin-bottom:.5rem; color:var(--teal); }
  .done p{ font-size:.88rem; color:var(--soft); line-height:1.8; }
  .done .keep{ margin-top:.9rem; display:inline-block; background:var(--teal-bg); color:var(--teal);
               font-size:.76rem; font-weight:700; padding:.45rem .9rem; border-radius:999px; }
  .guide{ max-width:340px; margin:1.3rem auto 0; text-align:left; background:var(--surface);
          border:1px solid var(--rule); border-radius:12px; padding:.9rem 1rem; }
  .guide li{ list-style:none; font-size:.8rem; color:var(--soft); line-height:1.65; padding-left:1.1rem;
             position:relative; margin-bottom:.45rem; }
  .guide li:last-child{ margin-bottom:0; }
  .guide li::before{ content:''; position:absolute; left:0; top:.52rem; width:5px; height:5px;
                     border-radius:50%; background:var(--teal); }
  .ticket .row{ display:flex; justify-content:space-between; gap:.6rem; font-size:.8rem;
                border-top:1px dashed var(--rule); padding-top:.5rem; margin-top:.5rem; }
  .ticket .row span:first-child{ color:var(--faint); }
  .ticket .row span:last-child{ font-weight:700; }
  .ticket{ margin:1.4rem auto 0; max-width:340px; background:var(--surface); border:2px solid var(--teal); border-radius:14px; padding:1.1rem 1rem; }
  .ticket .l{ font-size:.7rem; font-weight:700; color:var(--teal); letter-spacing:.1em; }
  .ticket .v{ font-family:'Nanum Myeongjo',serif; font-size:1.5rem; font-weight:800; margin:.3rem 0; }
  .ticket .d{ font-size:.8rem; color:var(--soft); line-height:1.7; }
  .again{ display:inline-block; margin-top:1.4rem; font-size:.82rem; color:var(--teal); font-weight:700; text-decoration:none; border-bottom:1px solid currentColor; }
  .foot{ font-size:.7rem; color:var(--faint); text-align:center; padding:1.6rem .95rem 0; line-height:1.7; }
</style>
</head>
<body>

<div id="root"></div>
<div class="foot">주식회사 헬로미추 · 2026. 9. 19.(토) 학산마당극 놀래</div>

<script>
'use strict';

const API_URL = 'https://script.google.com/macros/s/AKfycbwIl5ahXaZ_hkitvDbqqtK9kwDvxEjFGgzc-sShRJJyhsliAiZq1-bpUfMcEh3KZJaN/exec';

const EVENT_DATE = '2026. 9. 19.(토)';
const PROGRAMS = [
  { key:'컬러링', name:'컬러링 체험', meta:'무료 · 30분 · 회차당 6명', capacity:6 },
  { key:'바인더', name:'자개바인더 체험', meta:'30,000원 · 30분 · 회차당 5명', capacity:5 }
];

/* 회차표 (확정) — 13:00~18:30 · 회당 30분 · 11타임, 쉬는 시간 없이 연속 운영.
   API 응답이 아니라 이 표를 기준으로 그린다. 옛 배포본이 지난 행사의
   20분 격자(12:20·13:20…)를 내려줘도 화면과 링크가 어긋나지 않게 하기 위해서다. */
const SLOT_TIMES = ['13:00','13:30','14:00','14:30','15:00','15:30',
                    '16:00','16:30','17:00','17:30','18:00'];
const EVENT_YMD  = { y:2026, m:9, d:19 };
const DESIGNS = ['01 소서노','02 문학산성','03 갯벌','04 수봉폭포'];

let slots = [], stock = {}, loaded = false, live = false;

/* 사이트 예약 현황에서 회차를 눌러 넘어오면 그대로 선택해 둔다 */
const QS = new URLSearchParams(location.search);
const F = {
  program: PROGRAMS.some(p=>p.key===QS.get('program')) ? QS.get('program') : '',
  time: SLOT_TIMES.indexOf(QS.get('time')||'') !== -1 ? QS.get('time') : '',
  name:'', tel:'', design:''
};

const esc = v => String(v).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const root = document.getElementById('root');

let seq = 0;
function call(params, timeoutMs){
  return new Promise((resolve,reject)=>{
    const cb='__rv'+(++seq)+'_'+Date.now();
    const url=new URL(API_URL);
    Object.keys(params).forEach(k=>{ if(params[k]!==undefined && params[k]!=='') url.searchParams.set(k,params[k]); });
    url.searchParams.set('cb',cb);
    const s=document.createElement('script');
    let done=false;
    const clean=()=>{ delete window[cb]; s.remove(); clearTimeout(t); };
    const t=setTimeout(()=>{ if(!done){done=true;clean();reject(new Error('시간 초과. 네트워크를 확인해 주세요.'));} }, timeoutMs || 20000);
    window[cb]=d=>{ done=true; clean(); (d&&d.ok===false)?reject(new Error(d.error||'오류')):resolve(d); };
    s.onerror=()=>{ if(!done){done=true;clean();reject(new Error('네트워크 오류'));} };
    s.src=url.toString();
    document.body.appendChild(s);
  });
}

/* 행사 당일 기준으로 지난 회차를 판정한다 (시작 + 30분이 지나면 종료) */
function isPast(time){
  const now = new Date(new Date().getTime() +
              (new Date().getTimezoneOffset()*60000) + 9*3600000);   // KST
  const today = now.getFullYear()*10000 + (now.getMonth()+1)*100 + now.getDate();
  const event = EVENT_YMD.y*10000 + EVENT_YMD.m*100 + EVENT_YMD.d;
  if (today < event) return false;
  if (today > event) return true;
  const p = time.split(':');
  return now.getHours()*60 + now.getMinutes() >= Number(p[0])*60 + Number(p[1]) + 30;
}

/* 프로그램 구분이 있고 계획된 회차인 응답만 잔여로 인정한다.
   하나도 없으면 구버전 배포본이 응답한 것이므로 잔여를 비워 두고(live=false)
   접수를 막는다. 옛 예약 수가 이 행사 회차의 '마감'으로 둔갑하면 안 된다. */
function normalize(apiSlots){
  const byKey = {};
  live = false;
  (Array.isArray(apiSlots)?apiSlots:[]).forEach(s=>{
    if (!s || !s.program) return;
    const t = String(s.time||'').trim();
    if (SLOT_TIMES.indexOf(t) === -1) return;
    if (!PROGRAMS.some(p=>p.key===s.program)) return;
    byKey[s.program+'|'+t] = s;
    live = true;
  });

  const out = [];
  PROGRAMS.forEach(p=>SLOT_TIMES.forEach(t=>{
    const s = byKey[p.key+'|'+t];
    out.push({
      program: p.key, time: t, past: isPast(t),
      remain: s ? Math.max(0, Number(s.remain)||0) : (live ? p.capacity : null)
    });
  }));
  return out;
}

async function load(){
  try{
    const d = await call({}, 8000);       // 조회는 짧게 끊는다 (접수는 기본 20초 유지)
    slots = normalize(d.slots);
    stock = {};
    (d.sheetStock||[]).forEach(s=>{ stock[s.key]=s.remain; });
  }catch(e){ slots = normalize(null); }
  loaded = true;
  render();
}

function slotsFor(program){
  return slots.filter(s=>s.program===program);
}

function render(){
  const prog = PROGRAMS.filter(p=>p.key===F.program)[0];
  const list = F.program ? slotsFor(F.program) : [];
  const ready = live && F.program && F.time && F.name.trim() && F.tel.trim();

  let h = '<header><h1>체험 예약</h1>' +
    '<div class="when">' + EVENT_DATE + ' · 수봉산 폭포 앞<br>13:00 ~ 18:30 · 30분 11회차</div></header>' +
    '<div class="err" id="err"></div>';

  if (loaded && !live) {
    h += '<div class="notice"><b>예약 서버 점검 중입니다.</b><br>' +
         '회차는 예정대로 ' + EVENT_DATE + ' 13:00~18:30 · 30분 11회차로 운영하지만, ' +
         '지금은 온라인 접수를 받을 수 없습니다. 잠시 후 다시 시도하시거나 현장 부스로 문의해 주세요.</div>';
  }

  h += '<div class="pane">';

  h += '<h2>참여 프로그램</h2><div class="progs">';
  PROGRAMS.forEach(p=>{
    h += '<button class="prog'+(F.program===p.key?' on':'')+'" type="button" data-prog="'+esc(p.key)+'">' +
         '<div class="n">'+esc(p.name)+'</div><div class="m">'+esc(p.meta)+'</div></button>';
  });
  h += '</div>';

  h += '<h2>예약 시간</h2>';
  if (!F.program){
    h += '<div class="card"><p class="hint" style="margin:0;">프로그램을 먼저 선택해 주세요.</p></div>';
  } else if (!loaded){
    h += '<div class="card"><p class="hint" style="margin:0;">잔여 현황을 불러오는 중...</p></div>';
  } else if (!list.length){
    h += '<div class="card"><p class="hint" style="margin:0;">잔여 현황을 불러오지 못했습니다. 새로고침해 주세요.</p></div>';
  } else {
    h += '<div class="times">';
    list.forEach(s=>{
      const pending = (s.remain === null);
      const off = s.past || pending || s.remain<=0;
      const label = s.past ? '지난 회차'
                  : pending ? '확인 중'
                  : (s.remain<=0 ? '마감' : '잔여 '+s.remain);
      h += '<button class="time'+(F.time===s.time?' on':'')+(!off&&s.remain<=2?' low':'')+'" type="button"' +
           ' data-time="'+esc(s.time)+'"'+(off?' disabled':'')+'>' +
           '<span class="t">'+esc(s.time)+'</span><span class="r">'+label+'</span></button>';
    });
    h += '</div>';
  }

  h += '<h2>예약자 정보</h2><div class="card">' +
    '<div class="field"><label class="f" for="fName">이름<span class="req">*</span></label>' +
    '<input id="fName" type="text" maxlength="20" placeholder="홍길동" value="'+esc(F.name)+'"></div>' +
    '<div class="field"><label class="f" for="fTel">연락처<span class="req">*</span></label>' +
    '<input id="fTel" type="tel" inputmode="numeric" maxlength="15" placeholder="010-0000-0000" value="'+esc(F.tel)+'">' +
    '<p class="hint">예약 확인 안내를 보내드립니다.</p></div></div>';

  h += '<h2>희망 도안 <span style="font-weight:400;letter-spacing:0;">(선택)</span></h2><div class="designs">';
  DESIGNS.forEach(d=>{
    const left = stock[d];
    const out = (left !== undefined && left <= 0);
    h += '<button class="design'+(F.design===d?' on':'')+'" type="button" data-design="'+esc(d)+'"'+(out?' disabled':'')+'>' +
         '<span class="n">'+esc(d)+'</span>' +
         '<span class="r">'+(left===undefined?'':(out?'품절':'잔여 '+left))+'</span></button>';
  });
  h += '</div><p class="hint">고르지 않으셔도 현장에서 남은 도안 중 선택하실 수 있습니다.</p>';

  h += '<h2>개인정보 수집·이용 안내</h2><div class="card pv">' +
    '<p class="lead">아래 내용을 확인하신 뒤 <b>예약하기</b>를 누르시면 ' +
      '개인정보 수집·이용에 동의하신 것으로 봅니다.</p>' +
    '<table><tr><th>수집 항목</th><th>이용 목적</th><th>보유 기간</th></tr>' +
    '<tr><td>이름<br>연락처</td>' +
        '<td>체험 예약 확인 및 본인 식별<br>현장 안내 · 회차 배정 · 노쇼 관리</td>' +
        '<td>행사 종료 후 1년<br>(사업 정산·결과보고 확인 후 파기)</td></tr></table>' +
    '<details><summary>자세히 보기 (거부 권리 · 제3자 제공)</summary><div class="full">' +
      '<p><b>관련 법규</b> 개인정보 보호법 제15조, 제22조</p>' +
      '<p><b>동의를 거부할 권리</b> 귀하는 개인정보 수집·이용 동의를 거부하실 권리가 있으며, ' +
        '거부에 따른 불이익은 없습니다. 다만 위 항목은 <b>체험 회차 배정과 현장 본인 확인에 ' +
        '반드시 필요한 사항</b>이므로, 동의하지 않으시면 사전 예약이 어렵습니다. ' +
        '이 경우 현장 부스에서 잔여 인원에 한해 접수하실 수 있습니다.</p>' +
      '<p><b>개인정보의 제공</b> 제공하신 정보는 관광두레 파일럿사업의 운영 실적 보고 목적으로 ' +
        '<b>한국관광공사</b>에 제공될 수 있습니다.</p>' +
      '<p><b>제3자 제공 및 목적 외 이용</b> 동의하신 내용 외의 다른 목적으로는 활용하지 않으며, ' +
        '위 기관 외 제3자에게 제공하지 않습니다.</p>' +
      '<p><b>열람·정정·삭제</b> 제공하신 개인정보의 이용을 거부하시거나 열람·정정·삭제를 ' +
        '원하시면 아래로 연락 주시면 지체 없이 처리해 드립니다.</p>' +
      '<p><b>개인정보 관리책임자</b> 주식회사 헬로미추 이영지 · 010-3394-3372</p>' +
    '</div></details></div>';

  h += '</div>';

  h += '<div class="bar">' +
    '<div class="sum">' + (loaded && !live
      ? '예약 서버 점검 중 — 현장 부스로 문의해 주세요'
      : (F.program && F.time
        ? '<b>'+esc(prog.name)+' '+esc(F.time)+'</b> 회차로 예약합니다'
        : '프로그램과 시간을 선택해 주세요')) + '</div>' +
    '<p class="consent"><b>예약하기</b>를 누르면 위 개인정보 수집·이용에 동의한 것으로 봅니다.</p>' +
    '<button type="button" id="submit"'+(ready?'':' disabled')+'>예약하기</button></div>';

  root.innerHTML = h;
  bind();
}

function bind(){
  root.querySelectorAll('[data-prog]').forEach(el=>el.addEventListener('click',()=>{
    F.program = (F.program===el.dataset.prog) ? '' : el.dataset.prog;
    F.time = '';
    render();
  }));
  root.querySelectorAll('[data-time]').forEach(el=>el.addEventListener('click',()=>{
    F.time = (F.time===el.dataset.time) ? '' : el.dataset.time;
    render();
  }));
  root.querySelectorAll('[data-design]').forEach(el=>el.addEventListener('click',()=>{
    F.design = (F.design===el.dataset.design) ? '' : el.dataset.design;
    render();
  }));
  const n=document.getElementById('fName'), t=document.getElementById('fTel');
  if (n) n.addEventListener('input',()=>{ F.name=n.value; toggleSubmit(); });
  if (t) t.addEventListener('input',()=>{ F.tel=t.value; toggleSubmit(); });

  const b=document.getElementById('submit');
  if (b) b.addEventListener('click',submit);
}

function toggleSubmit(){
  const b=document.getElementById('submit');
  if (b) b.disabled = !(live && F.program && F.time && F.name.trim() && F.tel.trim());
}

async function submit(){
  const b=document.getElementById('submit');
  const err=document.getElementById('err');
  b.disabled=true; b.textContent='접수 중...';
  err.classList.remove('on');
  try{
    const r = await call({ action:'book', program:F.program, time:F.time,
                           name:F.name.trim(), tel:F.tel.trim(), design:F.design, agree:1 });
    done(r);
  }catch(e){
    err.textContent = e.message || '예약하지 못했습니다.';
    err.classList.add('on');
    b.disabled=false; b.textContent='예약하기';
    window.scrollTo({top:0,behavior:'smooth'});
    load();                                   // 마감됐을 수 있으니 잔여를 다시 읽는다
  }
}

function done(r){
  const prog = PROGRAMS.filter(p=>p.key===r.program)[0] || {name:r.program};
  const fee  = (r.program === '바인더') ? '30,000원 (현장 결제)' : '무료';

  saveBooking(r, prog);          // 사이트 첫 화면에서도 예약 내역을 보여주기 위해 저장

  root.innerHTML =
    '<div class="done"><div class="mark"></div>' +
    '<h1>' + (r.duplicate ? '이미 예약되어 있습니다' : '예약이 완료되었습니다') + '</h1>' +
    '<p>' + esc(F.name) + ' 님, 예약이 정상 접수되었습니다.<br>' +
    EVENT_DATE + ' 수봉산 폭포 앞에서 뵙겠습니다.</p>' +
    '<span class="keep">이 화면을 캡처해 두세요</span>' +

    '<div class="ticket"><div class="l">예약 회차</div>' +
      '<div class="v">' + esc(r.time) + '</div>' +
      '<div class="d">' + esc(prog.name) + '</div>' +
      '<div class="row"><span>일시</span><span>' + EVENT_DATE + '</span></div>' +
      '<div class="row"><span>장소</span><span>수봉산 폭포 앞</span></div>' +
      '<div class="row"><span>예약자</span><span>' + esc(F.name) + '</span></div>' +
      '<div class="row"><span>연락처</span><span>' + esc(F.tel) + '</span></div>' +
      (F.design ? '<div class="row"><span>희망 도안</span><span>' + esc(F.design) + '</span></div>' : '') +
      '<div class="row"><span>참가비</span><span>' + fee + '</span></div>' +
    '</div>' +

    '<ul class="guide">' +
      '<li>시작 <b>5분 전</b>까지 부스로 와주세요. 늦으시면 다음 회차로 안내될 수 있습니다.</li>' +
      '<li>현장에서 <b>이름</b>을 말씀해 주시면 예약 확인됩니다. 따로 문자는 보내지 않습니다.</li>' +
      '<li>체험 후 <b>설문 작성</b>을 부탁드립니다. 작품은 설문 완료 화면을 보여주시면 봉투에 담아 드려요.</li>' +
      '<li>예약 변경·취소는 현장 부스로 문의해 주세요.</li>' +
    '</ul>' +

    '<a class="again" href="index.html">사이트로 돌아가기</a></div>';
  window.scrollTo(0,0);
}

/* 예약 내역을 브라우저에 남겨 둔다. 사이트 첫 화면 상단에 "예약 완료"로 뜬다. */
function saveBooking(r, prog){
  try{
    localStorage.setItem('hm_booking', JSON.stringify({
      program: r.program, progName: prog.name, time: r.time,
      name: F.name, design: F.design, at: Date.now()
    }));
    localStorage.setItem('hm_last_program', r.program);
    localStorage.setItem('hm_last_time', r.time);
    localStorage.setItem('hm_last_ts', Date.now());
  }catch(e){}
}

render();
load();
</script>

</body>
</html>
