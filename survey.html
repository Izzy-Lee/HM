<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>만족도 설문 · 헬로미추</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{
  --pink:#F4B8C8; --pink-soft:#FCE9EE; --pink-deep:#E8859F;
  --ink:#141414; --ink-2:#555; --line:#E7E2E3; --bg:#FFFBFC; --white:#fff;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink);font-family:Pretendard,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;padding:0 16px 80px}
.wrap{max-width:640px;margin:0 auto}
header.top{display:flex;align-items:center;justify-content:space-between;padding:18px 0 10px}
.logo{font-weight:800;letter-spacing:-.02em;font-size:15px;display:flex;align-items:center}
.logo img{height:26px;display:block}
.logo span{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--pink);margin-right:6px}
.progress{height:4px;background:var(--pink-soft);border-radius:4px;overflow:hidden;margin-bottom:22px}
.progress i{display:block;height:100%;width:0;background:var(--ink);transition:width .35s}
.hero{background:var(--ink);color:#fff;border-radius:22px;padding:28px 24px;margin-bottom:18px;position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;right:-40px;top:-40px;width:150px;height:150px;border-radius:50%;background:var(--pink);opacity:.9}
.hero small{display:block;color:var(--pink);font-weight:700;font-size:13px;margin-bottom:10px;position:relative;z-index:1}
.hero h1{font-size:26px;line-height:1.35;letter-spacing:-.03em;position:relative;z-index:1;max-width:85%}
.hero p{margin-top:12px;color:#ddd;font-size:14px;position:relative;z-index:1}
.card{background:var(--white);border:1px solid var(--line);border-radius:18px;padding:22px 20px;margin-bottom:14px}
.card h2{font-size:18px;letter-spacing:-.02em;margin-bottom:6px}
.muted{color:var(--ink-2);font-size:14px;line-height:1.6}
.types{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.type{border:1.5px solid var(--line);background:#fff;border-radius:16px;padding:16px 14px;text-align:left;font:inherit;cursor:pointer;transition:.15s}
.type b{display:block;font-size:15px;margin-bottom:4px;line-height:1.35}
.type span{font-size:12px;color:var(--ink-2)}
.type .no{display:inline-block;width:20px;height:20px;border-radius:50%;background:var(--pink-soft);color:var(--pink-deep);font-size:12px;font-weight:800;text-align:center;line-height:20px;margin-bottom:8px}
.type.on{border-color:var(--ink);background:var(--pink-soft);box-shadow:inset 0 0 0 1px var(--ink)}
.type.on .no{background:var(--ink);color:#fff}
.shead{margin:0 4px 12px}
.shead .k{font-size:12px;color:var(--pink-deep);font-weight:800}
.shead .t{font-size:15px;font-weight:800;margin-top:2px;letter-spacing:-.02em}
.notice{background:#FFF4D6;border:1px solid #F1D98A;color:#6B5310;border-radius:12px;padding:10px 14px;font-size:13px;line-height:1.55;margin-bottom:14px}
.sec h2{font-size:17px}
.sec .desc{margin-bottom:6px}
.q{padding:18px 0;border-top:1px solid var(--line)}
.q:first-of-type{border-top:0}
.q .t{font-weight:700;font-size:15.5px;line-height:1.5;margin-bottom:10px}
.q .t em{font-style:normal;color:var(--pink-deep);margin-right:6px;font-size:13px}
.q .sub{font-size:13px;color:var(--ink-2);margin:-4px 0 10px}
.q.miss .t{color:#C0392B}
.opts{display:flex;flex-wrap:wrap;gap:7px}
.opt{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:9px 14px;font:inherit;font-size:14px;cursor:pointer;line-height:1.3;text-align:left}
.opt.on{background:var(--ink);border-color:var(--ink);color:#fff}
.multi .opt.on{background:var(--pink-soft);color:var(--ink);border-color:var(--ink)}
.multi .opt.on:before{content:"✓ ";font-weight:800}
.etc{margin-top:8px;display:none}
.etc.show{display:block}
input[type=text],textarea{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;font:inherit;font-size:16px;background:#fff;color:var(--ink)}
input:focus,textarea:focus{outline:none;border-color:var(--ink)}
textarea{min-height:84px;resize:vertical;line-height:1.55}
.mx{display:grid;gap:12px}
.mx .row{background:#FDFAFB;border:1px solid var(--line);border-radius:14px;padding:12px}
.mx .rl{font-size:14px;font-weight:700;margin-bottom:8px}
.mx .sc{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
.mx .sc button{border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:8px 2px;font:inherit;font-size:11.5px;cursor:pointer;line-height:1.25;word-break:keep-all}
.mx .sc button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.mx .row.miss .rl{color:#C0392B}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:17px;font:inherit;font-size:16px;font-weight:800;cursor:pointer;background:var(--ink);color:#fff;margin-top:8px}
.btn:disabled{opacity:.35;cursor:default}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line);font-weight:700}
.row2{display:flex;gap:8px}
.row2 .btn{flex:1}
.step{display:none}
.step.on{display:block;animation:up .3s ease}
@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.demo{background:#FFF4D6;border:1px solid #F1D98A;color:#6B5310;border-radius:12px;padding:10px 14px;font-size:13px;margin-bottom:14px;display:none}
.done{text-align:center;padding:36px 20px}
.done .dot{width:76px;height:76px;border-radius:50%;background:var(--pink);margin:0 auto 16px;display:flex;align-items:center;justify-content:center;font-size:36px;font-weight:900}
.done .stamp{display:inline-block;margin-top:16px;background:var(--ink);color:#fff;border-radius:14px;padding:14px 20px;font-weight:800;font-size:15px;line-height:1.6}
.done .stamp small{display:block;font-weight:600;color:var(--pink);font-size:12px}
.err{color:#C0392B;font-size:13px;margin-top:10px;min-height:18px;text-align:center}
.priv{font-size:12px;color:#999;text-align:center;margin-top:16px;line-height:1.6}
footer{text-align:center;color:#999;font-size:12px;margin-top:30px}
</style>
</head>
<body>
<div class="wrap">
  <header class="top"><div class="logo" id="logo"><span></span>Hello Michu</div><div class="muted" id="stepLabel" style="font-size:12px"></div></header>
  <div class="progress"><i id="bar"></i></div>
  <div class="demo" id="demo">미리보기 모드예요. config.js에 Apps Script 주소가 없어서 응답이 저장되지 않아요.</div>

  <!-- 시작 -->
  <section class="step on" id="s0">
    <div class="hero">
      <small>만족도 설문</small>
      <h1>체험은 어떠셨나요?</h1>
      <p>솔직한 이야기가 더 좋게 만들어요.</p>
    </div>
    <div class="card">
      <h2>참여하신 체험을 골라 주세요</h2>
      <p class="muted">2026 인천 원도사제 · 10월 24일(토)</p>
      <div class="types" id="typeBox"></div>
    </div>
    <button class="btn" id="startBtn" disabled>시작하기</button>
  </section>

  <!-- 문항 -->
  <section class="step" id="sQ">
    <div class="shead"><div class="k" id="sTag"></div><div class="t" id="sHead"></div></div>
    <div class="notice" id="sNotice"></div>
    <div class="card sec" id="secBox"></div>
    <div class="row2"><button class="btn ghost" id="prevBtn">이전</button><button class="btn" id="nextBtn">다음</button></div>
    <div class="err" id="err"></div>
  </section>

  <!-- 완료 -->
  <section class="step" id="sDone">
    <div class="card done">
      <div class="dot">✓</div>
      <h2>소중한 의견 감사드립니다.</h2>
      <p class="muted" style="margin-top:8px" id="doneMsg"></p>
      <div class="stamp" id="stamp"></div>
      <p class="priv">본 설문에서 수집된 정보는 상품 개발 및 파일럿사업 결과보고 목적으로만 활용됩니다.<br>주식회사 헬로미추</p>
    </div>
  </section>

  <footer id="foot">주식회사 헬로미추 · Hello Michu</footer>
</div>

<script src="config.js"></script>
<script>
(function(){
  var $ = function(id){ return document.getElementById(id); };
  var esc = function(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); };
  var NO = ['①','②','③','④'];
  var S = null, page = 0, A = {}, warned = false;

  if (!apiReady()) $('demo').style.display = 'block';
  if (typeof BRAND !== 'undefined') {
    if (BRAND.logoImg) { $('logo').innerHTML = '<img alt="">'; $('logo').firstChild.src = BRAND.logoImg; $('logo').firstChild.alt = BRAND.name; }
    if (BRAND.footer) $('foot').textContent = BRAND.footer;
  }

  /* 체험 선택 */
  SEA_SURVEYS.forEach(function(sv, i){
    var b = document.createElement('button');
    b.type = 'button'; b.className = 'type'; b.dataset.k = sv.key;
    b.innerHTML = '<span class="no">' + (i+1) + '</span><b>' + esc(sv.label) + '</b><span>' + esc(sv.tag.replace(/[\[\]]/g,'')) + '</span>';
    b.onclick = function(){ pick(sv.key); };
    $('typeBox').appendChild(b);
  });
  function pick(k){
    S = SEA_SURVEYS.filter(function(x){ return x.key === k; })[0] || null;
    [].forEach.call(document.querySelectorAll('.type'), function(x){ x.classList.toggle('on', S && x.dataset.k === S.key); });
    $('startBtn').disabled = !S;
  }
  var qt = new URLSearchParams(location.search).get('t');
  if (qt) pick(qt);

  function show(id){
    ['s0','sQ','sDone'].forEach(function(x){ $(x).classList.toggle('on', x === id); });
    window.scrollTo({top:0, behavior:'smooth'});
  }
  $('startBtn').onclick = function(){ page = 0; A = {}; warned = false; render(); show('sQ'); };

  /* 섹션 렌더 */
  function render(){
    var sec = S.sections[page], N = S.sections.length;
    $('sTag').textContent = S.tag;
    $('sHead').textContent = S.head;
    $('sNotice').textContent = S.notice;
    $('sNotice').style.display = page === 0 ? 'block' : 'none';
    $('bar').style.width = Math.round((page + 1) / (N + 1) * 100) + '%';
    $('stepLabel').textContent = (page + 1) + ' / ' + N;
    $('prevBtn').textContent = page === 0 ? '처음으로' : '이전';
    $('nextBtn').textContent = page === N - 1 ? '제출하기' : '다음';
    $('err').textContent = '';

    var h = '<h2>' + esc(sec.title) + '</h2>' + (sec.desc ? '<p class="muted desc">' + esc(sec.desc) + '</p>' : '');
    sec.qs.forEach(function(q){
      h += '<div class="q" id="q_' + q.id + '"><div class="t">' + (q.type === 'text' ? '<em>▶</em>' : '<em>' + esc(q.id) + '</em>') + esc(q.title) + '</div>';
      if (q.sub) h += '<div class="sub">' + esc(q.sub) + '</div>';
      if (q.type === 'one' || q.type === 'multi' || q.type === 'contact') {
        h += '<div class="opts ' + (q.type === 'multi' ? 'multi' : '') + '">';
        q.opts.forEach(function(o, i){ h += '<button type="button" class="opt" data-q="' + q.id + '" data-v="' + esc(o) + '">' + (q.type === 'multi' ? '' : (q.type === 'one' ? '' : '')) + esc(o) + '</button>'; });
        h += '</div>';
        if (q.opts.indexOf('기타') > -1) h += '<div class="etc" id="etc_' + q.id + '"><input type="text" maxlength="100" placeholder="기타 내용을 적어 주세요" data-etc="' + q.id + '"></div>';
        if (q.type === 'contact') h += '<div class="etc" id="etc_' + q.id + '"><input type="text" maxlength="100" placeholder="연락처 또는 이메일" data-etc="' + q.id + '"></div>';
      } else if (q.type === 'matrix') {
        h += '<div class="mx">';
        q.rows.forEach(function(r, ri){
          h += '<div class="row" id="mx_' + q.id + '_' + ri + '"><div class="rl">' + esc(r) + '</div><div class="sc">';
          q.opts.forEach(function(o){ h += '<button type="button" data-mq="' + q.id + '" data-r="' + ri + '" data-v="' + esc(o) + '">' + esc(o) + '</button>'; });
          h += '</div></div>';
        });
        h += '</div>';
      } else {
        h += '<textarea maxlength="1500" data-txt="' + q.id + '"></textarea>';
      }
      h += '</div>';
    });
    $('secBox').innerHTML = h;
    restore(sec);
    bind();
  }

  function restore(sec){
    sec.qs.forEach(function(q){
      var v = A[q.id];
      if (q.type === 'one' || q.type === 'contact') {
        mark(q.id, v ? [v.v] : []);
        if (v && v.etc != null) { var e = document.querySelector('[data-etc="' + q.id + '"]'); if (e) e.value = v.etc; }
      } else if (q.type === 'multi') {
        mark(q.id, v ? v.v : []);
        if (v && v.etc != null) { var e2 = document.querySelector('[data-etc="' + q.id + '"]'); if (e2) e2.value = v.etc; }
      } else if (q.type === 'matrix') {
        (q.rows).forEach(function(r, ri){
          var val = v && v[ri];
          [].forEach.call(document.querySelectorAll('[data-mq="' + q.id + '"][data-r="' + ri + '"]'), function(b){ b.classList.toggle('on', b.dataset.v === val); });
        });
      } else {
        var t = document.querySelector('[data-txt="' + q.id + '"]'); if (t && v) t.value = v;
      }
    });
  }
  function mark(id, list){
    [].forEach.call(document.querySelectorAll('.opt[data-q="' + id + '"]'), function(b){ b.classList.toggle('on', list.indexOf(b.dataset.v) > -1); });
    var e = $('etc_' + id);
    if (e) e.classList.toggle('show', list.indexOf('기타') > -1 || list.indexOf('예') > -1);
  }
  function qById(id){ var r = null; S.sections.forEach(function(s){ s.qs.forEach(function(q){ if (q.id === id) r = q; }); }); return r; }

  function bind(){
    [].forEach.call(document.querySelectorAll('.opt'), function(b){
      b.onclick = function(){
        var q = qById(b.dataset.q), v = b.dataset.v;
        if (q.type === 'multi') {
          var cur = (A[q.id] && A[q.id].v) || [];
          cur = cur.indexOf(v) > -1 ? cur.filter(function(x){ return x !== v; }) : cur.concat([v]);
          A[q.id] = { v: cur, etc: A[q.id] && A[q.id].etc };
          mark(q.id, cur);
        } else {
          A[q.id] = { v: v, etc: A[q.id] && A[q.id].etc };
          mark(q.id, [v]);
        }
        $('q_' + q.id).classList.remove('miss');
      };
    });
    [].forEach.call(document.querySelectorAll('[data-etc]'), function(inp){
      inp.oninput = function(){ var id = inp.dataset.etc; A[id] = A[id] || { v: qById(id).type === 'multi' ? [] : '' }; A[id].etc = inp.value; };
    });
    [].forEach.call(document.querySelectorAll('[data-mq]'), function(b){
      b.onclick = function(){
        var id = b.dataset.mq, ri = +b.dataset.r;
        A[id] = A[id] || {}; A[id][ri] = b.dataset.v;
        [].forEach.call(document.querySelectorAll('[data-mq="' + id + '"][data-r="' + ri + '"]'), function(x){ x.classList.toggle('on', x === b); });
        $('mx_' + id + '_' + ri).classList.remove('miss');
      };
    });
    [].forEach.call(document.querySelectorAll('[data-txt]'), function(t){
      t.oninput = function(){ A[t.dataset.txt] = t.value; };
    });
  }

  /* 빠진 선택형 문항 (서술형은 선택) */
  function missingIn(sec){
    var miss = [];
    sec.qs.forEach(function(q){
      if (q.type === 'text') return;
      if (q.type === 'matrix') {
        q.rows.forEach(function(r, ri){ if (!(A[q.id] && A[q.id][ri])) miss.push(['mx_' + q.id + '_' + ri]); });
        return;
      }
      var v = A[q.id];
      var empty = !v || (Array.isArray(v.v) ? !v.v.length : !v.v);
      if (empty) miss.push(['q_' + q.id]);
    });
    return miss;
  }

  $('prevBtn').onclick = function(){ if (page === 0) { show('s0'); return; } page--; render(); window.scrollTo({top:0, behavior:'smooth'}); };
  $('nextBtn').onclick = function(){
    var sec = S.sections[page];
    var miss = missingIn(sec);
    [].forEach.call(document.querySelectorAll('.miss'), function(x){ x.classList.remove('miss'); });
    if (miss.length && !warned) {
      miss.forEach(function(m){ var el = $(m[0]); if (el) el.classList.add('miss'); });
      $('err').textContent = '빠진 문항이 ' + miss.length + '개 있어요. 그대로 넘어가려면 한 번 더 눌러 주세요.';
      warned = true;
      var first = $(miss[0][0]); if (first) first.scrollIntoView({behavior:'smooth', block:'center'});
      return;
    }
    warned = false;
    if (page < S.sections.length - 1) { page++; render(); window.scrollTo({top:0, behavior:'smooth'}); return; }
    submit();
  };

  /* 시트 저장용: [제목, 값] 목록 */
  function columns(){
    var cols = [];
    S.sections.forEach(function(sec){
      sec.qs.forEach(function(q){
        var v = A[q.id];
        if (q.type === 'matrix') {
          q.rows.forEach(function(r, ri){ cols.push([q.id + ' ' + r, (v && v[ri]) || '']); });
          return;
        }
        var head = q.id + ' ' + q.title.replace(/\s*\(복수 선택 가능\)/, '');
        if (head.length > 60) head = head.slice(0, 58) + '…';
        var out = '';
        if (q.type === 'text') out = v || '';
        else if (v) {
          var list = Array.isArray(v.v) ? v.v.slice() : (v.v ? [v.v] : []);
          if (v.etc && (list.indexOf('기타') > -1 || list.indexOf('예') > -1)) {
            list = list.map(function(x){ return (x === '기타' || x === '예') ? x + ': ' + v.etc.trim() : x; });
          }
          out = list.join(', ');
        }
        cols.push([head, out]);
      });
    });
    return cols;
  }

  var sending = false;
  function submit(){
    if (sending) return; sending = true;
    var btn = $('nextBtn'); btn.disabled = true; btn.textContent = '보내는 중…';
    var payload = { action: 'sea', key: S.key, label: S.label, sheet: S.sheet, cols: columns() };
    var p = apiReady() ? postData(payload) : new Promise(function(r){ setTimeout(r, 500); });
    p.then(function(){
      var now = new Date();
      $('doneMsg').textContent = S.done;
      $('stamp').innerHTML = '<small>설문 완료</small>' + esc(S.label) + '<br>' +
        (now.getMonth()+1) + '/' + now.getDate() + ' ' + String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0');
      $('bar').style.width = '100%'; $('stepLabel').textContent = '';
      show('sDone');
    }).catch(function(){
      $('err').textContent = '전송에 실패했어요. 인터넷 연결을 확인하고 다시 눌러 주세요.';
      btn.disabled = false; btn.textContent = '제출하기'; sending = false;
    });
  }
})();
</script>
</body>
</html>
