<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>컬러링 접수대</title>
<meta name="robots" content="noindex">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  :root {
    --ink: #14100b; --soft: #5a4e42; --faint: #8b8075; --paper: #f6f2ea; --surface: #fff;
    --teal: #14796a; --amber: #b8620f; --red: #b23838; --rule: #ddd4c6;
  }
  body {
    background: var(--paper); color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, 'Noto Sans KR', sans-serif;
    font-size: 15px; padding: 0 0 6rem; max-width: 560px; margin: 0 auto;
    -webkit-text-size-adjust: 100%;
  }

  .top { position: sticky; top: 0; z-index: 30; background: var(--teal); color: #fff; padding: 0.7rem 0.9rem; }
  .top .t { font-size: 1.05rem; font-weight: 800; letter-spacing: -0.01em; }
  .top .s { font-size: 0.7rem; opacity: 0.8; margin-top: 0.15rem; }

  .slotbar { position: sticky; top: 56px; z-index: 29; background: var(--surface); border-bottom: 1px solid var(--rule); padding: 0.6rem 0.9rem; display: flex; gap: 0.5rem; align-items: center; }
  .slotbar select { flex: 1; min-height: 48px; border: 1px solid var(--rule); border-radius: 10px; background: #fff; font-family: inherit; font-size: 1rem; font-weight: 700; padding: 0 0.7rem; color: var(--ink); }
  .slotbar .re { flex: none; min-width: 52px; min-height: 48px; border: 1px solid var(--rule); border-radius: 10px; background: #fff; font-family: inherit; font-size: 1.1rem; cursor: pointer; }

  .counts { display: flex; gap: 0.4rem; padding: 0.6rem 0.9rem 0; }
  .counts div { flex: 1; background: var(--surface); border: 1px solid var(--rule); border-radius: 10px; padding: 0.5rem 0.2rem; text-align: center; }
  .counts b { display: block; font-size: 1.25rem; font-variant-numeric: tabular-nums; }
  .counts span { font-size: 0.66rem; color: var(--faint); }

  .list { padding: 0.6rem 0.9rem 0; display: flex; flex-direction: column; gap: 0.5rem; }

  .p { background: var(--surface); border: 1px solid var(--rule); border-radius: 12px; padding: 0.75rem 0.85rem; }
  .p.att { border-color: var(--teal); background: #f2faf8; }
  .p.no  { opacity: 0.5; }

  .phead { display: flex; align-items: baseline; gap: 0.55rem; }
  .nm { font-size: 1.12rem; font-weight: 800; letter-spacing: -0.01em; }
  .tel { font-size: 1.12rem; font-weight: 800; font-variant-numeric: tabular-nums; color: var(--amber); letter-spacing: 0.02em; }
  .tel.none { color: var(--faint); font-weight: 600; font-size: 0.8rem; letter-spacing: 0; }
  .flag { margin-left: auto; font-size: 0.68rem; font-weight: 700; padding: 0.2rem 0.45rem; border-radius: 999px; }
  .flag.att { background: var(--teal); color: #fff; }
  .flag.no { background: var(--red); color: #fff; }

  .acts { display: flex; gap: 0.4rem; margin-top: 0.6rem; }
  .acts button { flex: 1; min-height: 52px; border: 1px solid var(--rule); border-radius: 10px; background: #fff; font-family: inherit; font-size: 0.92rem; font-weight: 700; color: var(--soft); cursor: pointer; }
  .acts button.go { flex: 2; background: var(--teal); border-color: var(--teal); color: #fff; font-size: 1rem; }
  .acts button.on-att { background: var(--teal); border-color: var(--teal); color: #fff; }
  .acts button.on-no { background: var(--red); border-color: var(--red); color: #fff; }

  .designs { display: flex; flex-wrap: wrap; gap: 0.35rem; margin-top: 0.5rem; }
  .designs button { flex: 1 1 46%; min-height: 46px; border: 1px solid var(--rule); border-radius: 9px; background: #fff; font-family: inherit; font-size: 0.85rem; color: var(--soft); cursor: pointer; }
  .designs button.on { border-color: var(--amber); background: var(--amber); color: #fff; font-weight: 700; }
  .designs button:disabled { opacity: 0.35; cursor: not-allowed; }

  .rv { margin-top: 0.55rem; border-radius: 10px; padding: 0.55rem 0.65rem; font-size: 0.8rem; line-height: 1.6; }
  .rv.wait { background: #fdf6ec; border: 1px dashed var(--amber); color: var(--amber); font-weight: 700; }
  .rv.done { background: #eef7f4; border: 1px solid var(--teal); color: var(--soft); }
  .rv.done b { display: block; color: var(--teal); font-size: 0.72rem; margin-bottom: 0.2rem; letter-spacing: 0.03em; }
  .give { width: 100%; min-height: 54px; margin-top: 0.5rem; border: 0; border-radius: 10px; background: var(--amber); color: #fff; font-family: inherit; font-size: 1rem; font-weight: 800; cursor: pointer; }
  .give.done { background: #eef7f4; color: var(--teal); border: 1px solid var(--teal); }

  .walk { padding: 0.9rem; }
  .walk .row { display: flex; gap: 0.4rem; }
  .walk input { flex: 1; min-height: 50px; border: 1px solid var(--rule); border-radius: 10px; padding: 0 0.7rem; font-family: inherit; font-size: 1rem; background: #fff; color: var(--ink); }
  .walk button { flex: none; min-width: 96px; min-height: 50px; border: 0; border-radius: 10px; background: var(--ink); color: #fff; font-family: inherit; font-size: 0.92rem; font-weight: 700; cursor: pointer; }

  .note { font-size: 0.74rem; color: var(--faint); line-height: 1.7; padding: 0.9rem; }
  .empty { text-align: center; color: var(--faint); font-size: 0.85rem; padding: 2.2rem 1rem; }

  .gate { padding: 3rem 1.2rem; text-align: center; }
  .gate input { width: 100%; max-width: 220px; min-height: 52px; text-align: center; font-size: 1.3rem; font-family: inherit; letter-spacing: 0.3em; border: 1px solid var(--rule); border-radius: 10px; background: #fff; color: var(--ink); }
  .gate button { display: block; width: 100%; max-width: 220px; margin: 0.6rem auto 0; min-height: 52px; border: 0; border-radius: 10px; background: var(--teal); color: #fff; font-family: inherit; font-size: 1rem; font-weight: 700; cursor: pointer; }

  .toast { position: fixed; left: 50%; bottom: 1.6rem; transform: translateX(-50%) translateY(140%); background: var(--ink); color: #fff; padding: 0.75rem 1.1rem; border-radius: 10px; font-size: 0.88rem; font-weight: 600; transition: transform .25s; z-index: 60; max-width: 92vw; text-align: center; }
  .toast.on { transform: translateX(-50%) translateY(0); }
  .toast.bad { background: var(--red); }
</style>
</head>
<body>

<div class="gate" id="gate">
  <p style="font-size:0.9rem;color:var(--soft);margin-bottom:1rem;">컬러링 접수대 · 접근키를 입력하세요</p>
  <input id="gateKey" type="tel" inputmode="numeric" placeholder="••••" aria-label="접근키">
  <button type="button" id="gateGo">열기</button>
</div>

<div id="app" hidden>
  <div class="top">
    <div class="t">수채화 컬러링 접수대</div>
    <div class="s" id="topSub">이름과 휴대폰 뒷 4자리를 확인하고 체험을 시작하세요</div>
  </div>

  <div class="slotbar">
    <select id="slotSel" aria-label="회차"></select>
    <button type="button" class="re" id="reload" aria-label="새로고침">↻</button>
  </div>

  <div class="counts">
    <div><b id="cWait">0</b><span>대기</span></div>
    <div><b id="cAtt">0</b><span>체험 중</span></div>
    <div><b id="cGive">0</b><span>작품 전달</span></div>
  </div>

  <div class="list" id="list"><p class="empty">불러오는 중…</p></div>

  <div class="walk">
    <div class="row">
      <input id="walkIn" placeholder="현장 접수 — 이름" aria-label="현장 접수 이름">
      <button type="button" id="walkBtn">명단 추가</button>
    </div>
  </div>

  <p class="note">
    <b>순서</b> ① 이름·뒷번호 확인 → <b>체험 시작</b> ② 도안 선택 ③ 손님이 QR로 후기 작성
    → 후기가 뜨면 <b>작품 전달</b>.<br>
    후기를 아직 안 쓰셨으면 "후기 작성 전"으로 뜹니다. 테이블 QR을 안내해 주세요.<br>
    화면은 20초마다 저절로 새로고침됩니다.
  </p>
</div>

<div class="toast" id="toast"></div>

<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbwIl5ahXaZ_hkitvDbqqtK9kwDvxEjFGgzc-sShRJJyhsliAiZq1-bpUfMcEh3KZJaN/exec';
const TIMES = ['13:00','13:30','14:00','14:30','15:00','15:30','16:00','16:30','17:00','17:30','18:00'];

const qs = new URLSearchParams(location.search);
let KEY   = qs.get('k') || '';
let STAFF = qs.get('staff') || '';
let slot  = '';
let data  = { people: [], designs: [] };
let timer = null;

const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c =>
  ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const $ = id => document.getElementById(id);

let seq = 0;
function call(params) {
  return new Promise((resolve, reject) => {
    const cb = '__hc' + (++seq) + '_' + Date.now();
    const url = new URL(API_URL);
    Object.keys(params).forEach(k => {
      if (params[k] !== undefined && params[k] !== null && params[k] !== '') url.searchParams.set(k, params[k]);
    });
    url.searchParams.set('cb', cb);
    const s = document.createElement('script');
    let done = false;
    const cleanup = () => { delete window[cb]; s.remove(); clearTimeout(t); };
    const t = setTimeout(() => { if (!done) { done = true; cleanup(); reject(new Error('시간 초과')); } }, 15000);
    window[cb] = d => { done = true; cleanup(); (d && d.ok === false) ? reject(new Error(d.error || '오류')) : resolve(d); };
    s.onerror = () => { if (!done) { done = true; cleanup(); reject(new Error('네트워크 오류')); } };
    s.src = url.toString();
    document.body.appendChild(s);
  });
}

let toastT = null;
function toast(msg, bad) {
  const el = $('toast');
  el.textContent = msg;
  el.className = 'toast on' + (bad ? ' bad' : '');
  clearTimeout(toastT);
  toastT = setTimeout(() => { el.className = 'toast'; }, 2600);
}

/* ── 회차 ── */
function fillSlots() {
  $('slotSel').innerHTML = TIMES.map(t => {
    const v = '컬러링 ' + t;
    return '<option value="' + v + '">' + t + ' 회차</option>';
  }).join('');
}

/** 지금 시각에 가장 가까운 회차를 기본으로 고른다 */
function defaultSlot() {
  const now = new Date();
  const mins = now.getHours() * 60 + now.getMinutes();
  let best = TIMES[0];
  for (const t of TIMES) {
    const [h, m] = t.split(':').map(Number);
    if (h * 60 + m <= mins + 10) best = t;
  }
  return '컬러링 ' + best;
}

/* ── 그리기 ── */
function render() {
  const el = $('list');
  const ppl = data.people || [];
  if (!ppl.length) {
    el.innerHTML = '<p class="empty">이 회차에 예약자가 없습니다.<br>현장에서 오신 분은 아래에서 추가하세요.</p>';
    $('cWait').textContent = $('cAtt').textContent = $('cGive').textContent = '0';
    return;
  }

  let wait = 0, att = 0, give = 0;
  el.innerHTML = ppl.map(p => {
    const isAtt = p.status === '참석';
    const isNo  = p.status === '노쇼';
    const given = p.done === '전달' || p.done === '완성';
    if (isAtt) att++; else if (!isNo) wait++;
    if (given) give++;

    let body = '<div class="p ' + (isAtt ? 'att' : isNo ? 'no' : '') + '" data-name="' + esc(p.name) + '">' +
      '<div class="phead">' +
        '<span class="nm">' + esc(p.name) + '</span>' +
        (p.tel4 ? '<span class="tel">' + esc(p.tel4) + '</span>'
                : '<span class="tel none">번호 없음</span>') +
        (isAtt ? '<span class="flag att">체험 중</span>' : '') +
        (isNo  ? '<span class="flag no">노쇼</span>' : '') +
      '</div>';

    body += '<div class="acts">' +
      '<button type="button" class="go ' + (isAtt ? 'on-att' : '') + '" data-st="참석">' +
        (isAtt ? '체험 중' : '체험 시작') + '</button>' +
      '<button type="button" class="' + (isNo ? 'on-no' : '') + '" data-st="노쇼">노쇼</button>' +
    '</div>';

    if (isAtt) {
      body += '<div class="designs">' + (data.designs || []).map(d =>
        '<button type="button" data-design="' + esc(d) + '" class="' + (p.design === d ? 'on' : '') + '">' +
        esc(d) + '</button>').join('') + '</div>';

      if (p.review) {
        body += '<div class="rv done"><b>후기 작성 완료 · ' + esc(p.review.at || '') + '</b>' +
                esc(p.review.text || '(내용 없음)') + '</div>' +
                '<button type="button" class="give ' + (given ? 'done' : '') + '" data-give="1">' +
                (given ? '✓ 작품 전달 완료' : '작품 전달하기') + '</button>';
      } else {
        body += '<div class="rv wait">후기 작성 전 — 테이블 QR을 안내해 주세요</div>';
      }
    }

    return body + '</div>';
  }).join('');

  $('cWait').textContent = wait;
  $('cAtt').textContent  = att;
  $('cGive').textContent = give;
}

/* ── 불러오기 ── */
let loading = false;
async function load(quiet) {
  if (loading) return;
  loading = true;
  if (!quiet) $('list').innerHTML = '<p class="empty">불러오는 중…</p>';
  try {
    data = await call({ action: 'desk', slot: slot, k: KEY });
    render();
  } catch (e) {
    if (!quiet) $('list').innerHTML = '<p class="empty">' + esc(e.message) + '<br>↻ 를 눌러 다시 시도해 주세요.</p>';
  } finally {
    loading = false;
  }
}

/* ── 조작 ── */
async function send(params, msg) {
  try {
    await call(Object.assign({ k: KEY, staff: STAFF, slot: slot }, params));
    toast(msg);
    await load(true);
  } catch (e) {
    toast(e.message, true);
  }
}

document.addEventListener('click', ev => {
  const btn = ev.target.closest('button');
  if (!btn) return;
  const card = btn.closest('.p');
  if (!card) return;
  const name = card.dataset.name;
  const cur  = (data.people || []).find(x => x.name === name) || {};

  if (btn.dataset.st) {
    const want = btn.dataset.st;
    const same = cur.status === want;
    send({ action: 'checkin', name: name, status: same ? '' : want,
           design: cur.design || '', done: cur.done || '' },
         same ? '취소했습니다' : name + ' — ' + want);
    return;
  }
  if (btn.dataset.design) {
    const d = btn.dataset.design;
    const same = cur.design === d;
    send({ action: 'checkin', name: name, status: '참석',
           design: same ? '' : d, done: cur.done || '' },
         same ? '도안 해제' : d);
    return;
  }
  if (btn.dataset.give) {
    const given = cur.done === '전달' || cur.done === '완성';
    send({ action: 'checkin', name: name, status: '참석',
           design: cur.design || '', done: given ? '' : '전달' },
         given ? '전달 취소' : name + ' — 작품 전달 완료');
  }
});

/* ── 현장 접수 ── */
$('walkBtn').addEventListener('click', async () => {
  const n = $('walkIn').value.trim();
  if (!n) { toast('이름을 입력해 주세요', true); return; }
  await send({ action: 'checkin', name: n, status: '참석' }, n + ' 현장 접수');
  $('walkIn').value = '';
});

$('slotSel').addEventListener('change', e => { slot = e.target.value; load(); });
$('reload').addEventListener('click', () => load());

/* ── 시작 ── */
function start() {
  $('gate').hidden = true;
  $('app').hidden = false;
  fillSlots();
  slot = defaultSlot();
  $('slotSel').value = slot;
  load();
  clearInterval(timer);
  timer = setInterval(() => load(true), 20000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) load(true); });
}

$('gateGo').addEventListener('click', () => {
  const v = $('gateKey').value.trim();
  if (!v) return;
  KEY = v;
  history.replaceState(null, '', '?k=' + encodeURIComponent(v) + (STAFF ? '&staff=' + encodeURIComponent(STAFF) : ''));
  start();
});
$('gateKey').addEventListener('keydown', e => { if (e.key === 'Enter') $('gateGo').click(); });

if (KEY) start();
</script>
</body>
</html>
