<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>헬로미추 체험 설문</title>
<meta name="robots" content="noindex">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@700;800&family=Noto+Sans+KR:wght@400;500;700&display=swap');
  *,*::before,*::after { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  :root{
    --ink:#14100b; --soft:#5f5346; --faint:#8b7f70;
    --paper:#f6f2ea; --surface:#fff; --sunk:#efe9de;
    --teal:#14796a; --teal-bg:#e4f0ec; --amber:#b8620f; --red:#b23838;
    --rule:#ddd4c6;
  }
  body{
    background:var(--paper); color:var(--ink);
    font-family:'Noto Sans KR',-apple-system,BlinkMacSystemFont,sans-serif;
    font-size:15px; line-height:1.7; padding:0 0 7rem; max-width:560px; margin:0 auto;
    -webkit-text-size-adjust:100%;
  }

  /* 진행률 */
  .top{ position:sticky; top:0; z-index:20; background:var(--paper); padding:.9rem .95rem .5rem; }
  .top .row{ display:flex; align-items:baseline; justify-content:space-between; gap:.6rem; margin-bottom:.45rem; }
  .top .who{ font-size:.72rem; font-weight:700; color:var(--teal); letter-spacing:.04em; }
  .top .cnt{ font-size:.7rem; color:var(--faint); font-variant-numeric:tabular-nums; }
  .prog{ height:5px; background:var(--sunk); border-radius:3px; overflow:hidden; }
  .prog i{ display:block; height:100%; background:var(--teal); border-radius:3px; width:0; transition:width .35s ease; }

  .pane{ padding:.6rem .95rem 0; }
  h1{ font-family:'Nanum Myeongjo',serif; font-size:1.4rem; font-weight:800; line-height:1.35; margin-bottom:.5rem; }
  h2{ font-family:'Nanum Myeongjo',serif; font-size:1.15rem; font-weight:700; margin:.2rem 0 .25rem; }
  .sdesc{ font-size:.82rem; color:var(--soft); margin-bottom:1.1rem; }

  .q{ background:var(--surface); border:1px solid var(--rule); border-radius:12px; padding:.95rem 1rem; margin-bottom:.75rem; }
  .q > .label{ font-size:.92rem; font-weight:700; line-height:1.55; margin-bottom:.65rem; }
  .q .req{ color:var(--red); font-weight:700; margin-left:.15rem; }
  .q.miss{ border-color:var(--red); background:#fdf3f2; }
  .hint{ font-size:.75rem; color:var(--faint); font-weight:400; display:block; margin-top:.15rem; }

  .opts{ display:flex; flex-direction:column; gap:.45rem; }
  .opts.grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(104px,1fr)); }
  .opt{
    display:flex; align-items:center; gap:.55rem; min-height:50px; padding:.5rem .75rem;
    border:1.5px solid var(--rule); border-radius:9px; background:var(--paper);
    font-size:.87rem; cursor:pointer; line-height:1.45; user-select:none;
  }
  .opt .box{
    flex:none; width:21px; height:21px; border:2px solid var(--rule); background:#fff;
    border-radius:50%; position:relative;
  }
  .opt.multi .box{ border-radius:5px; }
  .opt.on{ border-color:var(--teal); background:var(--teal-bg); font-weight:700; }
  .opt.on .box{ border-color:var(--teal); background:var(--teal); }
  .opt.on .box::after{
    content:''; position:absolute; left:50%; top:47%; transform:translate(-50%,-50%) rotate(-45deg);
    width:9px; height:5px; border:2px solid #fff; border-top:0; border-right:0;
  }
  input[type=text], input[type=email], textarea{
    width:100%; font-family:inherit; font-size:.88rem; color:var(--ink);
    background:var(--paper); border:1.5px solid var(--rule); border-radius:9px;
    padding:.6rem .7rem; margin-top:.5rem; line-height:1.6;
  }
  textarea{ min-height:82px; resize:vertical; }
  input:focus, textarea:focus{ outline:2px solid var(--teal); outline-offset:1px; border-color:var(--teal); }
  .count{ font-size:.7rem; color:var(--faint); text-align:right; margin-top:.2rem; font-variant-numeric:tabular-nums; }

  /* 5점 척도 */
  .mrow{ padding:.6rem 0; border-bottom:1px solid rgba(90,78,66,.09); }
  .mrow:last-child{ border-bottom:none; padding-bottom:0; }
  .mrow .mlabel{ font-size:.85rem; font-weight:500; margin-bottom:.45rem; }
  .scale{ display:grid; grid-template-columns:repeat(5,1fr); gap:.3rem; }
  .scale button{
    min-height:52px; border:1.5px solid var(--rule); background:var(--paper); border-radius:8px;
    font-family:inherit; font-size:.66rem; font-weight:500; color:var(--soft); cursor:pointer;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:.15rem; padding:.2rem .1rem;
    line-height:1.25;
  }
  .scale button .dot{ font-size:.95rem; font-weight:700; }
  .scale button.on{ border-color:var(--teal); background:var(--teal); color:#fff; font-weight:700; }

  /* 하단 이동 */
  .nav{
    position:fixed; left:0; right:0; bottom:0; z-index:30; max-width:560px; margin:0 auto;
    display:flex; gap:.6rem; padding:.7rem .95rem calc(.7rem + env(safe-area-inset-bottom));
    background:rgba(246,242,234,.97); border-top:1px solid var(--rule);
  }
  .nav button{
    min-height:56px; border-radius:11px; font-family:inherit; font-size:1rem; font-weight:700; cursor:pointer;
    border:2px solid var(--teal);
  }
  .nav .prev{ flex:none; padding:0 1.1rem; background:var(--surface); color:var(--teal); }
  .nav .next{ flex:1; background:var(--teal); color:#fff; }
  .nav button:disabled{ opacity:.45; }

  /* 완료 */
  .done{ padding:2.5rem 1.2rem; text-align:center; }
  .done .mark{ font-size:2.6rem; line-height:1; margin-bottom:.7rem; }
  .done h1{ margin-bottom:.5rem; }
  .done p{ font-size:.88rem; color:var(--soft); line-height:1.8; }
  .code{
    margin:1.4rem auto 0; max-width:340px; background:var(--surface);
    border:2px dashed var(--teal); border-radius:14px; padding:1.2rem 1rem;
  }
  .code .cl{ font-size:.72rem; font-weight:700; color:var(--teal); letter-spacing:.1em; }
  .code .cv{
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:2.1rem; font-weight:700;
    letter-spacing:.06em; margin:.35rem 0 .3rem;
  }
  .code .cd{ font-size:.8rem; color:var(--soft); line-height:1.65; }
  .pend{ background:#fff3e0; border:1px solid #e0b184; color:#7a5000; border-radius:9px;
         padding:.7rem .85rem; font-size:.78rem; margin-top:1rem; line-height:1.6; }

  .pick{ padding:1.4rem .95rem; }
  .pick .pb{
    display:block; width:100%; text-align:left; background:var(--surface); border:1.5px solid var(--rule);
    border-radius:12px; padding:1rem 1.05rem; margin-bottom:.65rem; font-family:inherit; cursor:pointer; color:var(--ink);
  }
  .pick .pb .t{ font-size:1rem; font-weight:700; }
  .pick .pb .d{ font-size:.78rem; color:var(--soft); margin-top:.15rem; }
  .pick .pb .g{ font-size:.72rem; color:var(--amber); font-weight:700; margin-top:.3rem; }

  .err{ background:#fdecea; border:1px solid var(--red); color:var(--red); border-radius:9px;
        padding:.7rem .85rem; font-size:.8rem; margin:0 .95rem .8rem; line-height:1.6; display:none; }
  .err.on{ display:block; }
  .foot{ font-size:.7rem; color:var(--faint); text-align:center; padding:1.6rem .95rem 0; line-height:1.7; }
</style>
</head>
<body>

<div id="root"></div>
<div class="foot" id="foot">
  수집된 정보는 상품 개발 및 마케팅 목적으로만 활용됩니다.<br>주식회사 헬로미추
</div>

<script>
'use strict';

const API_URL = 'https://script.google.com/macros/s/AKfycbwIl5ahXaZ_hkitvDbqqtK9kwDvxEjFGgzc-sShRJJyhsliAiZq1-bpUfMcEh3KZJaN/exec';

const AWARENESS = { k:'A-1 헬로미추 사전 인지도', t:'radio', req:true, o:[

const REGION_INTEREST = { k:'A-3 인천·미추홀 관심도', t:'radio', grid:true, req:true, o:[

        { k:'B-2a 원하는 인천 장소·이야기', t:'text', ph:'예: 차이나타운, 자유공원, 소래포구' } ]},

          '지금 바로 구매하고 싶다','목적이 생기면 구매하고 싶다','잘 모르겠다','구매 의향 없다'] },
        { k:'C-2a 구매 고려 이유', t:'multi', o:[

/* ── 상태 ──────────────────────────────────────────────────── */
let TYPE = QS.get('t') || '';
let SPEC = SURVEYS[TYPE] || null;
let step = 0;
let A = {};                                   // 응답
const DKEY = () => 'hm_survey_' + TYPE;

const esc = v => String(v).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const root = document.getElementById('root');

function saveDraft(){ try{ localStorage.setItem(DKEY(), JSON.stringify({step,A})); }catch(e){} }
function loadDraft(){
  try{
    const d = JSON.parse(localStorage.getItem(DKEY())||'null');
    if (d && d.A){ A = d.A; step = Math.min(d.step||0, SPEC.sections.length-1); }
  }catch(e){}
}
function clearDraft(){ try{ localStorage.removeItem(DKEY()); }catch(e){} }

/* ── JSONP ── */
let seq = 0;
function call(params){
  return new Promise((resolve,reject)=>{
    const cb = '__sv'+(++seq)+'_'+Date.now();
    const url = new URL(API_URL);
    Object.keys(params).forEach(k=>{ if(params[k]!==undefined && params[k]!=='') url.searchParams.set(k, params[k]); });
    url.searchParams.set('cb', cb);
    const s = document.createElement('script');
    let done=false;
    const clean=()=>{ delete window[cb]; s.remove(); clearTimeout(t); };
    const t=setTimeout(()=>{ if(!done){done=true;clean();reject(new Error('시간 초과'));} },20000);
    window[cb]=d=>{ done=true; clean(); (d&&d.ok===false)?reject(new Error(d.error||'오류')):resolve(d); };
    s.onerror=()=>{ if(!done){done=true;clean();reject(new Error('네트워크 오류'));} };
    s.src=url.toString();
    document.body.appendChild(s);
  });
}

function b64url(str){
  const bytes = new TextEncoder().encode(str);
  let bin=''; bytes.forEach(b=>bin+=String.fromCharCode(b));
  return btoa(bin).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
function newSid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
function newCode(){
  const AL='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let s=''; for(let i=0;i<4;i++) s+=AL.charAt(Math.floor(Math.random()*AL.length));
  return 'HM-'+s;
}

/* 응답이 길어 한 번에 안 들어가므로 조각내 보낸다. 마지막 조각에서 서버가 시트에 쓴다. */
const CHUNK = 1200;
async function submit(sub){
  const parts = [];
  for (let i=0; i<sub.d.length; i+=CHUNK) parts.push(sub.d.slice(i, i+CHUNK));
  let last = null;
  for (let i=0; i<parts.length; i++){
    last = await call({ action:'survey', t:sub.t, sid:sub.sid, i:i, n:parts.length,
                        d:parts[i], slot:sub.slot, name:sub.name, code:sub.code });
  }
  return last;
}

/* 전송 실패한 설문은 통째로 쌓아뒀다가 재시도 */
const QKEY='hm_survey_queue';
const qGet=()=>{ try{ return JSON.parse(localStorage.getItem(QKEY)||'[]'); }catch(e){ return []; } };
const qSet=v=>{ try{ localStorage.setItem(QKEY, JSON.stringify(v)); }catch(e){} };
async function flushQueue(){
  const q=qGet();
  while(q.length){
    try{ await submit(q[0]); q.shift(); qSet(q.slice()); }
    catch(e){ qSet(q.slice()); return; }
  }
}

/* ── 렌더 ──────────────────────────────────────────────────── */
function render(){
  if (!SPEC) return renderPicker();
  const sec = SPEC.sections[step];
  const total = SPEC.sections.length;

  let h = '<div class="top"><div class="row">' +
    '<span class="who">'+esc(SPEC.name)+' 설문</span>' +
    '<span class="cnt">'+(step+1)+' / '+total+'</span></div>' +
    '<div class="prog"><i style="width:'+Math.round((step)/total*100)+'%"></i></div></div>';

  h += '<div class="err" id="err"></div><div class="pane">';
  if (step===0) h += '<h1>'+esc(SPEC.head)+'</h1><p class="sdesc">'+esc(SPEC.lead)+'</p>';
  h += '<h2>'+esc(sec.title)+'</h2><p class="sdesc">'+esc(sec.desc)+'</p>';
  sec.items.forEach((it,i)=> h += renderItem(it, i));
  h += '</div>';

  h += '<div class="nav">' +
    (step>0 ? '<button class="prev" type="button" id="bPrev">이전</button>' : '') +
    '<button class="next" type="button" id="bNext">'+(step===total-1?'제출하기':'다음')+'</button></div>';

  root.innerHTML = h;
  bind(sec);
}

/* 'B-1a 인상 깊었던 점' → '인상 깊었던 점'
   코드는 시트 컬럼명으로만 남기고 화면에는 문장만 보여준다. */
function pretty(k){ return String(k).replace(/^(Q\d+|[A-E](-\d+[a-z]?)?)\s+/, ''); }

function renderItem(it, i){
  const id = 'q'+i;
  const label = it.label || pretty(it.k);
  const req = it.req ? '<span class="req">*</span>' : '';
  let inner = '';

  if (it.t==='radio' || it.t==='multi'){
    const multi = it.t==='multi';
    const cur = A[it.k];
    const on = v => multi ? (Array.isArray(cur)&&cur.indexOf(v)!==-1) : cur===v;
    inner += '<div class="opts'+(it.grid?' grid':'')+'">';
    it.o.forEach(v=>{
      inner += '<div class="opt'+(multi?' multi':'')+(on(v)?' on':'')+'" data-k="'+esc(it.k)+'" data-v="'+esc(v)+'" data-m="'+(multi?1:0)+'">' +
               '<span class="box"></span><span>'+esc(v)+'</span></div>';
    });
    if (it.etc){
      const etcOn = on('기타');
      inner += '<div class="opt'+(multi?' multi':'')+(etcOn?' on':'')+'" data-k="'+esc(it.k)+'" data-v="기타" data-m="'+(multi?1:0)+'">' +
               '<span class="box"></span><span>기타</span></div>';
      inner += '<input type="text" data-etc="'+esc(it.k)+'" placeholder="기타 내용" value="'+esc(A[it.k+' 기타']||'')+'"'+(etcOn?'':' hidden')+'>';
    }
    inner += '</div>';
    if (it.follow){
      const show = A[it.k]===it.follow.on;
      inner += '<input type="text" data-follow="'+esc(it.follow.k)+'" placeholder="'+esc(it.follow.ph)+'" value="'+esc(A[it.follow.k]||'')+'"'+(show?'':' hidden')+'>';
    }
  }
  else if (it.t==='matrix'){
    inner += '<div>';
    it.rows.forEach(row=>{
      const key = it.k+' '+row;
      inner += '<div class="mrow"><div class="mlabel">'+esc(row)+'</div><div class="scale">';
      it.scale.forEach((sv,si)=>{
        inner += '<button type="button" data-k="'+esc(key)+'" data-v="'+esc(sv)+'"'+(A[key]===sv?' class="on"':'')+'>' +
                 '<span class="dot">'+(5-si)+'</span>'+esc(sv)+'</button>';
      });
      inner += '</div></div>';
    });
    inner += '</div>';
  }
  else if (it.t==='text'){
    inner += '<textarea data-t="'+esc(it.k)+'" maxlength="300" placeholder="'+esc(it.ph||'')+'">'+esc(A[it.k]||'')+'</textarea>' +
             '<div class="count"><span>'+(A[it.k]||'').length+'</span> / 300</div>';
  }
  else if (it.t==='short'){
    inner += '<input type="text" data-t="'+esc(it.k)+'" maxlength="60" placeholder="'+esc(it.ph||'')+'" value="'+esc(A[it.k]||'')+'">';
  }

  return '<div class="q" id="'+id+'" data-key="'+esc(it.k)+'"><div class="label">'+label+req+'</div>'+inner+'</div>';
}

function bind(sec){
  root.querySelectorAll('.opt').forEach(el=>el.addEventListener('click',()=>{
    const k=el.dataset.k, v=el.dataset.v, multi=el.dataset.m==='1';
    if (multi){
      const cur = Array.isArray(A[k]) ? A[k].slice() : [];
      const at = cur.indexOf(v);
      if (at===-1) cur.push(v); else cur.splice(at,1);
      A[k]=cur;
    } else {
      A[k] = (A[k]===v) ? '' : v;
    }
    saveDraft(); render();
  }));

  root.querySelectorAll('.scale button').forEach(el=>el.addEventListener('click',()=>{
    const k=el.dataset.k;
    A[k] = (A[k]===el.dataset.v) ? '' : el.dataset.v;
    saveDraft();
    el.parentElement.querySelectorAll('button').forEach(b=>b.classList.remove('on'));
    if (A[k]) el.classList.add('on');
    const card = el.closest('.q'); if (card) card.classList.remove('miss');
  }));

  root.querySelectorAll('[data-t]').forEach(el=>el.addEventListener('input',()=>{
    A[el.dataset.t]=el.value; saveDraft();
    const c = el.parentElement.querySelector('.count span'); if (c) c.textContent = el.value.length;
  }));
  root.querySelectorAll('[data-etc]').forEach(el=>el.addEventListener('input',()=>{
    A[el.dataset.etc+' 기타']=el.value; saveDraft();
  }));
  root.querySelectorAll('[data-follow]').forEach(el=>el.addEventListener('input',()=>{
    A[el.dataset.follow]=el.value; saveDraft();
  }));

  const p=document.getElementById('bPrev');
  if (p) p.addEventListener('click',()=>{ step--; saveDraft(); render(); window.scrollTo(0,0); });
  document.getElementById('bNext').addEventListener('click',()=>next(sec));
}

function next(sec){
  const missing = [];
  sec.items.forEach((it,i)=>{
    if (!it.req) return;
    if (it.t==='matrix'){
      it.rows.forEach(r=>{ if(!A[it.k+' '+r]) missing.push('q'+i); });
    } else {
      const v=A[it.k];
      const empty = Array.isArray(v) ? v.length===0 : !v;
      if (empty) missing.push('q'+i);
    }
  });

  const err=document.getElementById('err');
  root.querySelectorAll('.q').forEach(q=>q.classList.remove('miss'));
  if (missing.length){
    missing.forEach(id=>{ const el=document.getElementById(id); if(el) el.classList.add('miss'); });
    err.textContent='답하지 않은 문항이 '+new Set(missing).size+'개 있습니다. 붉게 표시된 곳을 확인해 주세요.';
    err.classList.add('on');
    const first=document.getElementById(missing[0]);
    if (first) first.scrollIntoView({behavior:'smooth', block:'center'});
    return;
  }
  err.classList.remove('on');

  if (step < SPEC.sections.length-1){ step++; saveDraft(); render(); window.scrollTo(0,0); }
  else finish();
}

async function finish(){
  const btn=document.getElementById('bNext');
  btn.disabled=true; btn.textContent='보내는 중...';

  const sub = { t:TYPE, sid:newSid(), slot:SLOT, name:NAME, code:newCode(), d:b64url(JSON.stringify(A)) };
  let res=null, queued=false;
  try{ res = await submit(sub); }
  catch(e){ const q=qGet(); q.push(sub); qSet(q); queued=true; }

  clearDraft();
  renderDone(res, sub, queued);
}

function renderDone(res, sub, queued){
  const gift = res ? !!res.gift : (['binder','binder_buy','sticker'].indexOf(sub.t)!==-1);
  const code = (res && res.code) ? res.code : sub.code;

  let h = '<div class="done"><div class="mark">🎨</div>' +
    '<h1>설문이 제출되었습니다</h1>' +
    '<p>소중한 의견 감사드립니다.<br>남겨주신 내용은 다음 상품을 만드는 데 쓰입니다.</p>';

  if (gift){
    h += '<div class="code"><div class="cl">스티커 증정 코드</div>' +
         '<div class="cv">'+esc(code)+'</div>' +
         '<div class="cd">이 화면을 <b>부스 직원에게 보여주시면</b><br>데코스티커 1개를 드립니다.</div></div>';
  }
  if (queued){
    h += '<div class="pend">지금 네트워크가 불안정해 <b>전송 대기 중</b>입니다. ' +
         '이 화면을 닫지 마시고 직원에게 보여주세요. 신호가 돌아오면 자동으로 전송됩니다.</div>';
  }
  h += '</div>';
  root.innerHTML = h;
  window.scrollTo(0,0);
  if (queued) setTimeout(flushQueue, 3000);
}

function renderPicker(){
  let h = '<div class="pick"><h1>헬로미추 설문</h1>' +
    '<p class="sdesc">해당하는 설문을 골라 주세요.</p>';
  Object.keys(SURVEYS).forEach(k=>{
    const s=SURVEYS[k];
    const gift = ['binder','binder_buy','sticker'].indexOf(k)!==-1;
    h += '<button class="pb" type="button" data-t="'+k+'">' +
         '<div class="t">'+esc(s.name)+'</div>' +
         '<div class="d">'+esc(s.lead)+'</div>' +
         (gift?'<div class="g">작성하시면 데코스티커를 드립니다</div>':'') +
         '</button>';
  });
  h += '</div>';
  root.innerHTML = h;
  root.querySelectorAll('.pb').forEach(b=>b.addEventListener('click',()=>{
    TYPE=b.dataset.t; SPEC=SURVEYS[TYPE]; step=0; A={};
    loadDraft(); render(); window.scrollTo(0,0);
  }));
}

if (SPEC) loadDraft();
render();
flushQueue();
window.addEventListener('online', flushQueue);
</script>
